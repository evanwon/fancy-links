name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '!v*-dryrun'   # a tag to run dry runs on, which releases nothing by itself

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check the store keys only, releasing nothing (run it on a v*-dryrun tag)'
        type: boolean
        default: false
      create_release:
        description: 'Create GitHub release (only for manual builds)'
        type: boolean
        default: false
      submit_to_amo:
        description: 'Submit to AMO for public distribution'
        type: boolean
        default: false
      channel:
        description: 'AMO submission channel'
        type: choice
        options:
          - listed
          - unlisted
        default: listed
      version_notes:
        description: 'Version notes for AMO submission'
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    uses: evanwon/browser-extension-workflows/.github/workflows/build-release.yml@5c67ff734f69ac803e9a441b5762f99190f0f3ba # harden-release-keys branch
    with:
      extension-name: fancy-links
      extension-display-name: "Fancy Links"
      extension-description: "Transforms plain URLs into friendly links with page titles."
      manifest-version: 2
      lint-warnings-as-errors: true
      validate-tag-matches-manifest: true
      amo-submission-enabled: ${{ vars.AMO_SUBMISSION_ENABLED == 'true' }}
      issues-url: "https://github.com/evanwon/fancy-links/issues"
      amo-url: "https://addons.mozilla.org/en-US/firefox/addon/fancy-links/"
      firefox-min-version: "142+"
      permissions-description: "clipboardWrite, activeTab, storage, notifications"
      create-release: ${{ github.event.inputs.create_release == 'true' }}
      submit-to-amo: ${{ github.event.inputs.submit_to_amo == 'true' }}
      channel: ${{ github.event.inputs.channel || 'listed' }}
      dry-run: ${{ github.event.inputs.dry_run == 'true' }}
      version-notes: ${{ github.event.inputs.version_notes || '' }}
      chrome-enabled: true
      cws-submission-enabled: ${{ vars.CWS_SUBMISSION_ENABLED == 'true' }}
      cws-extension-id: ${{ vars.CWS_EXTENSION_ID }}
      chrome-min-version: "102+"
    # Passed by name, these resolve to the `release` environment's values, in the shared workflow's release job only.
    # The CWS ones are empty until they're set there and CWS_SUBMISSION_ENABLED is true.
    secrets:
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

name: Test Pull Request

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'manifests/**'
      - 'package*.json'
      - 'jest.config.js'

jobs:
  test:
    uses: evanwon/browser-extension-workflows/.github/workflows/test-pr.yml@5c67ff734f69ac803e9a441b5762f99190f0f3ba # harden-release-keys branch
    with:
      lint-warnings-as-errors: true
      validate-versions: true
      # The audit reports every open advisory, so failing on it failed each fix PR while other alerts were open.
      # It still runs and warns; dependency-review is the gate.
      security-audit-strict: false
      upload-coverage: true
      chrome-enabled: true

  # Fails a PR that adds a dependency with a moderate or worse advisory, whatever else is already open.
  dependency-review:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
